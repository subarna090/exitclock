<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" role="img" aria-label="A clock face with four marked intervals">
  <g transform="translate(220,220)">
    <circle r="196" fill="none" stroke="#1B3350" stroke-width="1.5"/>
    <circle r="170" fill="none" stroke="#23405E" stroke-width="2"/>
    <!-- four intervals, drawn as arcs on the outer ring -->
    <path d="M 0 -196 A 196 196 0 0 1 98.0 -169.7" fill="none" stroke="#FFCF33" stroke-width="7" stroke-linecap="round"/>
    <path d="M 138.6 -138.6 A 196 196 0 0 1 169.7 98.0" fill="none" stroke="#FFCF33" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <path d="M 98.0 169.7 A 196 196 0 0 1 -138.6 138.6" fill="none" stroke="#FFCF33" stroke-width="7" stroke-linecap="round" opacity=".6"/>
    <path d="M -169.7 -98.0 A 196 196 0 0 1 -50.7 -189.3" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="3 12" opacity=".5"/>
    <!-- hour ticks -->
    <g stroke="#3C5A72" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-170" x2="0" y2="-154"/><line x1="85" y1="-147.2" x2="77" y2="-133.4"/>
      <line x1="147.2" y1="-85" x2="133.4" y2="-77"/><line x1="170" y1="0" x2="154" y2="0"/>
      <line x1="147.2" y1="85" x2="133.4" y2="77"/><line x1="85" y1="147.2" x2="77" y2="133.4"/>
      <line x1="0" y1="170" x2="0" y2="154"/><line x1="-85" y1="147.2" x2="-77" y2="133.4"/>
      <line x1="-147.2" y1="85" x2="-133.4" y2="77"/><line x1="-170" y1="0" x2="-154" y2="0"/>
      <line x1="-147.2" y1="-85" x2="-133.4" y2="-77"/><line x1="-85" y1="-147.2" x2="-77" y2="-133.4"/>
    </g>
    <!-- hands, just past the hour -->
    <line x1="0" y1="0" x2="62" y2="-72" stroke="#FFCF33" stroke-width="9" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="-136" stroke="#FFCF33" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <line x1="0" y1="18" x2="-96" y2="-108" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <circle r="11" fill="#0B1B30" stroke="#FFCF33" stroke-width="4"/>
  </g>
</svg>
